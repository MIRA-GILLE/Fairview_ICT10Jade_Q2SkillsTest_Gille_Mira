<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 Skills Test</title>
    <style>
        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 24px;
            background: #f2f6f2;
            color: #2f3c32;
            font-family: "Trebuchet MS", sans-serif;
            text-align: center;
        }

        h1 {
            margin-bottom: 12px;
            color: #3f7046;
        }

        p {
            line-height: 1.6;
        }

        form {
            max-width: 440px;
            margin: 28px auto;
            padding: 24px;
            background: white;
            border: 1px solid #d9e3da;
            border-radius: 12px;
            box-shadow: 0 6px 18px #3f704620;
        }

        label {
            display: block;
            text-align: center;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            margin: 8px 0 18px;
            padding: 11px 12px;
            border: 1px solid #bdcdbf;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin: 0 4px;
            padding: 10px 20px;
            border: 0;
            border-radius: 6px;
            background: #3f7046;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #3f7046;
        }

        #input_name {
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <h1>Periodic Table Finder: Non-Metals</h1>
    <p>Enter an element symbol to find its name, atomic number, and atomic mass.</p>
    <form>
        <label for="periodic_table">Enter an element symbol:</label>
        <input type="text" id="periodic_table">
        <button type="button" py-click="periodic_element">Check</button>
        
    </form>
    <div id="input_name"></div>
    <script type="py">
        from pyscript import document

        elements = {
            "H": ("Hydrogen", 1, 1.008),
            "He": ("Helium", 2, 4.0026),
            "C": ("Carbon", 6, 12.011),
            "N": ("Nitrogen", 7, 14.007),
            "O": ("Oxygen", 8, 15.999),
            "F": ("Fluorine", 9, 18.998),
            "Ne": ("Neon", 10, 20.180),
            "P": ("Phosphorus", 15, 30.974),
            "S": ("Sulfur", 16, 32.06),
            "Cl": ("Chlorine", 17, 35.45),
            "Ar": ("Argon", 18, 39.948),
            "Se": ("Selenium", 34, 78.971),
            "Br": ("Bromine", 35, 79.904),
            "Kr": ("Krypton", 36, 83.798),
        }

        def periodic_element(event):
            element = document.getElementById("periodic_table").value.strip().title()
            details = elements.get(element, ("Element not found", "-", "-"))

            document.getElementById("input_name").innerHTML = f"""
                Symbol: {element}
                <br>
                Element: {details[0]}
                <br>
                Atomic Number: {details[1]}
                <br>
                Atomic Mass: {details[2]}
            """
    </script>
</body>
</html>
