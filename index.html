<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q2 Skills Test</title>
</head>
<body>
    <h1>Periodic Table Information Finder</h1>
    <p>Enter an element symbol to find out its name. You can also click the "Show" button to see the number of elements, whether the symbol is in the dictionary, and a list of all element symbols.</p>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form>
                    <label for="elements">Enter an element symbol</label>
                    <br>
                    <input type="text" id="elements" class="form-control">
                    <br>
                    <button type="button" class="btn btn-success" py-click="check_element">Check</button>
                    <button type="button" class="btn btn-danger" py-click="show_element">Show</button>
                </form>
            </div>
        </div>
    </div>
    <div id="output1"></div>
    <script type="py" src= "main.py"></script>
</body>
</html>
